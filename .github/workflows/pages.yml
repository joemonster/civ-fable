name: Publikacja na GitHub Pages

# Strona jest serwowana z gałęzi gh-pages (gra jest w pełni statyczna).
# Ten workflow po każdej zmianie na main odświeża gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4
      - name: Aktualizacja gałęzi gh-pages
        run: git push origin HEAD:gh-pages --force
