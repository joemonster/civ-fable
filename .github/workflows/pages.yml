name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Spakowanie strony (gra jest statyczna — bez budowania)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wdrożenie
        id: deployment
        uses: actions/deploy-pages@v4
